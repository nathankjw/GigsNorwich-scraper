name: Daily Norwich Gigs Scrape
on:
  schedule:
    - cron: '0 6 * * *'   # runs at 6:00am UTC every day
  workflow_dispatch:       # lets you also trigger it manually, for testing
permissions:
  contents: write   # needed so the workflow is allowed to save the files back here
# Stops two runs (e.g. a scheduled one and a manual test) from ever executing
# at the same time and racing each other to commit — the original cause of
# the "non-fast-forward" push failures.
concurrency:
  group: norwich-gigs-scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      gig_pages: ${{ steps.gig_pages_upload.outcome }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: pip install requests beautifulsoup4 selenium webdriver-manager lxml python-dateutil
      - name: Run the scraper
        run: python3 scrape_headless.py
      - name: Copy the CSVs into the repo folder
        run: |
          mkdir -p scraped_data
          cp ~/norwich-scraper/scraped_data/norwich_gigs.csv scraped_data/norwich_gigs.csv
          cp ~/norwich-scraper/scraped_data/norwich_gigs_flat.csv scraped_data/norwich_gigs_flat.csv
          # Archive + change report (guarded so a hiccup there can't block the main CSVs being saved)
          for f in norwich_gigs_archive.csv changes_latest.md changes_log.csv; do
            [ -f ~/norwich-scraper/scraped_data/$f ] && cp ~/norwich-scraper/scraped_data/$f scraped_data/$f
          done
          exit 0
      - name: Show what changed in the run summary
        run: |
          if [ -f scraped_data/changes_latest.md ]; then
            cat scraped_data/changes_latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
      # Visits each gig's own page for start/door times, age limit, a short
      # description and support acts (cached, so most pages aren't re-fetched).
      # Allowed to fail: a problem here must never stop the main listings.
      - name: Fetch extra gig details from event pages
        continue-on-error: true
        timeout-minutes: 15
        run: python3 event_details.py
      - name: Convert the CSV to JSON for the blog widget
        run: python3 csv_to_json.py
      - name: Split upcoming gigs into Instagram pages of 11
        run: python3 instagram_pages.py
      - name: Pull latest changes before saving
        run: |
          STASHED=$(git stash --include-untracked)
          git pull --rebase origin main
          if [[ "$STASHED" != *"No local changes to save"* ]]; then
            git stash pop
          fi
      - name: Save the new data back to this repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated daily scrape"
          file_pattern: scraped_data
      # One page per gig for gigs.norwichgigs.com (see gig_pages/README.md).
      # Built here, published by the deploy-gig-pages job below. Allowed to
      # fail, so a problem with the gig pages never stops the main listings.
      - name: Build the gig pages
        id: gig_pages_build
        continue-on-error: true
        run: python3 gig_pages/build_gig_pages.py
      - name: Package the gig pages for GitHub Pages
        id: gig_pages_upload
        if: steps.gig_pages_build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: gig_pages/dist
      # The steps below rebuild the home page with the gig rows baked into the
      # HTML (so Google sees them without running JavaScript) and push it to Blogger.
      # They run after the data is saved, so a Blogger problem can't lose a scrape.
      - name: Build the home page HTML (events included)
        run: python3 blogger/build_blogger_page.py
      - name: Publish the page to Blogger
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_PAGE_ID: ${{ secrets.BLOGGER_PAGE_ID }}
          BLOGGER_KIND: posts
        run: python3 blogger/publish_to_blogger.py

  # Publishes the gig pages to GitHub Pages. Needs Settings -> Pages -> Source
  # set to "GitHub Actions" (one-off; see gig_pages/README.md). Until then this
  # job fails on its own without affecting the scrape or the Blogger page.
  deploy-gig-pages:
    needs: scrape
    if: ${{ always() && needs.scrape.outputs.gig_pages == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
